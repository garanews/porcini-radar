<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Porcini Radar</title>
  <meta name="description" content="When and where to look for porcini, with an open-source AI that works offline in the woods.">
  <meta name="theme-color" content="#5b3a1e">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🍄 Porcini Radar</h1>
    <span id="net" class="badge"></span>
  </header>

  <main>
    <!-- RADAR -->
    <section id="tab-radar" class="tab active">
      <div class="actions">
        <button id="btn-here" class="primary" data-i18n="radar.here">📍 Radar here</button>
        <button id="btn-save-place" data-i18n="radar.save">➕ Save this spot</button>
        <button id="btn-refresh" data-i18n-title="radar.refresh">🔄</button>
      </div>
      <p id="radar-status" class="muted"></p>
      <div id="here"></div>
      <h2 data-i18n="radar.myPlaces">My spots</h2>
      <div id="places"><p class="muted" data-i18n="radar.noPlaces"></p></div>
      <p class="muted small" data-i18n-html="radar.note"></p>
    </section>

    <!-- DIARY -->
    <section id="tab-diary" class="tab">
      <details id="new-entry" class="card">
        <summary data-i18n="diary.new">➕ New outing</summary>
        <form id="entry-form">
          <label><span data-i18n="diary.photo"></span> <input type="file" name="photo" accept="image/*" capture="environment"></label>
          <div class="row">
            <label><span data-i18n="diary.found"></span> <input type="number" name="found" min="0" value="0" inputmode="numeric"></label>
            <label><span data-i18n="diary.grams"></span> <input type="number" name="grams" min="0" inputmode="numeric"></label>
          </div>
          <label><span data-i18n="diary.habitat"></span>
            <select name="habitat">
              <option value="beech" data-i18n="habitat.beech"></option>
              <option value="chestnut" data-i18n="habitat.chestnut"></option>
              <option value="fir" data-i18n="habitat.fir"></option>
              <option value="pine" data-i18n="habitat.pine"></option>
              <option value="oak" data-i18n="habitat.oak"></option>
              <option value="mixed" data-i18n="habitat.mixed"></option>
              <option value="other" data-i18n="habitat.other"></option>
            </select>
          </label>
          <label><span data-i18n="diary.notes"></span> <textarea name="notes" rows="3" data-i18n-placeholder="diary.notesPh"></textarea></label>
          <label class="check"><input type="checkbox" name="asPlace"> <span data-i18n="diary.asPlace"></span></label>
          <button class="primary" type="submit" data-i18n="diary.submit"></button>
          <p id="entry-status" class="muted small"></p>
        </form>
      </details>
      <div id="entries"></div>
      <button id="btn-export" data-i18n="diary.export"></button>
    </section>

    <!-- COMPASS: back to the car / to a spot, and SOS. GPS + compass only, works offline. -->
    <section id="tab-nav" class="tab">
      <button id="btn-car" class="primary wide" data-i18n="nav.saveCar"></button>
      <label class="field"><span data-i18n="nav.target"></span>
        <select id="nav-target"></select>
      </label>
      <div class="card compass">
        <svg id="nav-arrow" viewBox="0 0 100 100" aria-hidden="true"><path d="M50 6 L78 86 L50 70 L22 86 Z"/></svg>
        <div id="nav-dist" class="big">—</div>
        <p id="nav-info" class="muted small"></p>
        <button id="btn-compass" data-i18n="nav.enableCompass"></button>
      </div>
      <div class="card sos">
        <h2 data-i18n="sos.title"></h2>
        <div id="sos-coords" class="big mono">—</div>
        <p id="sos-extra" class="muted small"></p>
        <div class="sos-actions">
          <a class="button danger" href="tel:112" data-i18n="sos.call"></a>
          <a id="sos-sms" class="button" href="sms:" data-i18n="sos.sms"></a>
          <button id="sos-share" data-i18n="sos.share"></button>
        </div>
        <p class="muted small" data-i18n="sos.note"></p>
      </div>
    </section>

    <!-- ASK -->
    <section id="tab-ask" class="tab">
      <p class="warning" data-i18n-html="ask.warning"></p>
      <div id="model-box" class="card">
        <p class="small muted" data-i18n="ask.modelInfo"></p>
        <select id="model-select"></select>
        <button id="btn-load" class="primary" data-i18n="ask.load"></button>
        <button id="btn-remove" data-i18n="ask.remove" hidden></button>
        <progress id="model-progress" max="1" value="0" hidden></progress>
        <p id="model-status" class="muted small"></p>
        <details id="storage">
          <summary data-i18n="storage.title"></summary>
          <ul id="storage-list"></ul>
          <p id="storage-total" class="muted small"></p>
        </details>
      </div>
      <div id="chat"></div>
      <div class="chips">
        <button data-i18n="chip.where" data-i18n-q="chip.whereQ"></button>
        <button data-i18n="chip.diary" data-i18n-q="chip.diaryQ"></button>
        <button data-i18n="chip.here" data-i18n-q="chip.hereQ"></button>
      </div>
      <form id="ask-form">
        <input id="ask-input" data-i18n-placeholder="ask.placeholder" autocomplete="off" disabled>
        <button class="primary" disabled>➤</button>
      </form>
    </section>
  </main>

  <nav>
    <button data-tab="radar" class="active">📡<span data-i18n="nav.radar">Radar</span></button>
    <button data-tab="diary">📓<span data-i18n="nav.diary">Diary</span></button>
    <button data-tab="nav">🧭<span data-i18n="nav.compass">Compass</span></button>
    <button data-tab="ask">💬<span data-i18n="nav.ask">Ask</span></button>
  </nav>

  <script type="module" src="app.js"></script>
</body>
</html>
